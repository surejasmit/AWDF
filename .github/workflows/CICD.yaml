name: Docker CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            631865398827.dkr.ecr.us-east-1.amazonaws.com/awdf-backend:latest
            631865398827.dkr.ecr.us-east-1.amazonaws.com/awdf-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            631865398827.dkr.ecr.us-east-1.amazonaws.com/awdf-frontend:latest
            631865398827.dkr.ecr.us-east-1.amazonaws.com/awdf-frontend:${{ github.sha }}
