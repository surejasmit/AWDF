# Keeps at least one replica of each app running during voluntary
# disruptions (node upgrades, Karpenter spot recycling, kubectl drain).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: awdf
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: awdf
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  namespace: awdf
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: awdf
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
