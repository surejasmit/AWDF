# TEMPLATE ONLY - do not commit real credentials.
#
# Preferred (used by scripts/deploy-aws.ps1):
#   kubectl create secret generic awdf-secrets -n awdf \
#     --from-literal=MONGODB_URI='mongodb+srv://...' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Or fill in the values below, rename this file to secret.yaml, and apply it.
apiVersion: v1
kind: Secret
metadata:
  name: awdf-secrets
  namespace: awdf
  labels:
    app.kubernetes.io/name: awdf
    app.kubernetes.io/part-of: awdf
type: Opaque
stringData:
  # MongoDB Atlas (or any MongoDB) connection string
  MONGODB_URI: "REPLACE_WITH_MONGODB_URI"
  # Generate with: openssl rand -hex 32
  JWT_SECRET: "REPLACE_WITH_RANDOM_64_CHAR_HEX"
  # Optional SMTP / Gmail API credentials for email notifications
  EMAIL_USER: ""
  EMAIL_PASSWORD: ""
  CLIENT_ID: ""
  CLIENT_SECRET: ""
  REFRESH_TOKEN: ""
